openapi: 3.2.0
info:
  title: Workday Payroll Payroll Calculations API
  description: Core API for managing payroll processes within the Workday platform, including payroll calculations, employee pay data, deductions, earnings, payroll runs, and pay group configurations.
  version: v1
  contact:
    name: Workday Support
    url: https://www.workday.com/en-us/company/customer-support.html
    email: support@workday.com
  termsOfService: https://www.workday.com/en-us/legal.html
servers:
- url: https://api.workday.com/payroll/v1
  description: Workday Payroll Production
- url: https://{tenant}.workday.com/api/payroll/v1
  description: Workday Payroll Tenant-Specific
  variables:
    tenant:
      description: Workday tenant identifier
      default: your-tenant
security:
- bearerAuth: []
tags:
- name: Payroll Calculations
  description: Trigger and monitor payroll calculation processes
paths:
  /payRuns/{payRunId}/calculate:
    post:
      operationId: calculatePayRun
      summary: Workday Payroll Calculate a Pay Run
      description: Trigger payroll calculations for a specific pay run, processing all earnings, deductions, and taxes for included workers.
      tags:
      - Payroll Calculations
      parameters:
      - $ref: '#/components/parameters/payRunId'
      responses:
        '202':
          description: Calculation initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationStatus'
              examples:
                CalculatePayRun202Example:
                  summary: Default calculatePayRun 202 response
                  x-microcks-default: true
                  value:
                    id: calc_20260430_00012
                    payRunId: pr_20260430_weekly_001
                    status: Queued
                    startedAt: '2026-04-30T16:45:00Z'
                    completedAt: '2026-04-30T16:45:00Z'
                    errors:
                    - error: INVALID_REQUEST
                      message: Validation failed for the provided fields.
                      details:
                      - field: amount
                        message: Validation failed for the provided fields.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  responses:
    Unauthorized:
      description: Authentication required or token expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            UnauthorizedExample:
              summary: Default Unauthorized response
              x-microcks-default: true
              value:
                error: INVALID_REQUEST
                message: Validation failed for the provided fields.
                details:
                - field: amount
                  message: Validation failed for the provided fields.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            NotFoundExample:
              summary: Default NotFound response
              x-microcks-default: true
              value:
                error: INVALID_REQUEST
                message: Validation failed for the provided fields.
                details:
                - field: amount
                  message: Validation failed for the provided fields.
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            BadRequestExample:
              summary: Default BadRequest response
              x-microcks-default: true
              value:
                error: INVALID_REQUEST
                message: Validation failed for the provided fields.
                details:
                - field: amount
                  message: Validation failed for the provided fields.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error code
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: Validation failed for the provided fields.
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
          description: Detailed error information
    CalculationStatus:
      type: object
      properties:
        id:
          type: string
          description: Calculation job identifier
          example: calc_20260430_00012
        payRunId:
          type: string
          description: Associated pay run identifier
          example: pr_20260430_weekly_001
        status:
          type: string
          enum:
          - Queued
          - Processing
          - Completed
          - Failed
          description: Current status of the calculation
          example: Queued
        startedAt:
          type: string
          format: date-time
          description: When the calculation started
          example: '2026-04-30T16:45:00Z'
        completedAt:
          type: string
          format: date-time
          description: When the calculation completed
          example: '2026-04-30T16:45:00Z'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: Any errors encountered during calculation
  parameters:
    payRunId:
      name: payRunId
      in: path
      required: true
      description: Unique identifier for the pay run
      schema:
        type: string
      example: pr_20260430_weekly_001
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token obtained through Workday authentication. Requires payroll-related security scopes.
externalDocs:
  description: Workday Payroll API Documentation
  url: https://community.workday.com/sites/default/files/file-hosting/productionapi/index.html
